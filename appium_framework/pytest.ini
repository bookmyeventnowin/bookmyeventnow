[pytest]
# ──────────────────────────────────────────────
# BookMyEvent Now — Appium Pytest Configuration
# ──────────────────────────────────────────────

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    smoke: Smoke test suite — critical happy path flows
    regression: Regression test suite — full feature coverage
    e2e: End-to-end tests covering complete user journeys
    community_hall: Tests related to Community Hall booking
    login: Tests related to Login / Authentication
    booking: Tests related to the booking flow
    sanity: Sanity / BAT tests for post-deployment validation

# Output
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Reports
addopts =
    -v
    --tb=short
    --html=reports/html/smoke_report.html
    --self-contained-html
    -p no:warnings

# Timeout (seconds per test)
timeout = 180
